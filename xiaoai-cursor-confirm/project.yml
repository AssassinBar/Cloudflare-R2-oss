name: XiaoAiCursorConfirm
options:
  bundleIdPrefix: cn.xiaoai.cursor
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: 小爱确认
    PRODUCT_BUNDLE_IDENTIFIER: cn.xiaoai.cursor.confirm
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: Sources/XiaoAiCursorConfirm/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Sources/XiaoAiCursorConfirm/Resources/XiaoAiCursorConfirm.entitlements
    LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    COMBINE_HIDPI_IMAGES: true
targets:
  XiaoAiCursorConfirm:
    type: application
    platform: macOS
    sources:
      - Sources/XiaoAiCursorConfirm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.xiaoai.cursor.confirm
